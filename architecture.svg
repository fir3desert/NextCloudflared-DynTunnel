<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Nextcloud deployment architecture</title>
  <desc id="desc">Browser traffic reaches Nextcloud through Cloudflare and an outbound cloudflared Quick Tunnel. Nextcloud's host port is bound to LAN address 192.168.1.250. Nextcloud and Redis run in Docker on that host. MariaDB runs separately on LAN host 192.168.1.200. The tunnel updates Nextcloud trusted domains and sends its URL to Discord.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf1f8"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#135f9f"/>
      <stop offset="1" stop-color="#2f83bd"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16334c" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#2777b7"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#328354"/>
    </marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#74869a"/>
    </marker>
    <marker id="arrow-gray-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9 0L0 4.5L9 9z" fill="#74869a"/>
    </marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#23384d}
      .title{font-size:30px;font-weight:700;fill:#fff}
      .subtitle{font-size:15px;fill:#e6f3ff}
      .zone{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#72869a}
      .heading{font-size:18px;font-weight:700}
      .body{font-size:14px;fill:#52677b}
      .note{font-size:12px;fill:#687d91}
      .tiny{font-size:11px;fill:#687d91}
      .flow{fill:none;stroke:#2777b7;stroke-width:3;marker-end:url(#arrow-blue)}
      .tunnel{fill:none;stroke:#2777b7;stroke-width:3;marker-start:url(#arrow-gray-start);marker-end:url(#arrow-blue)}
      .data{fill:none;stroke:#328354;stroke-width:2.5;marker-end:url(#arrow-green)}
      .label{font-size:12px;font-weight:600;fill:#425c73}
    </style>
  </defs>

